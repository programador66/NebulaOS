# NebulaOS · tmux "invisível" — só bordas finas no verde do Theme8 do Deepin

# sem barra de status: a tela é só o terminal
set -g status off

# cores e terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# bordas: cinza escuro inativa, verde no painel ativo, título no topo
set -g pane-border-lines single
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#00cd00"
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# mouse: clicar escolhe o painel, roda rola o histórico
set -g mouse on

# conforto
set -sg escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
